name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the lower bound in packages/cli/package.json "engines", so
        # nothing newer slips into the CLI; 26 is the current release.
        node: [22, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The server tests run in workerd; their bindings come from
      # packages/server/vitest.config.ts, so no secrets or .dev.vars.
      - run: npm test
      - run: npm run build -w watcheroni
      - name: Check the CLI bundle runs
        run: node packages/cli/dist/watcheroni.mjs --version
